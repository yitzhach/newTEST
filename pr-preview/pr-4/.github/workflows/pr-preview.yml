# A live preview of every pull request, at its own URL, on the real host.
#
#   production   https://<owner>.github.io/<repo>/tracker/browse.html
#   preview      https://<owner>.github.io/<repo>/pr-preview/pr-<n>/tracker/browse.html
#
# Same origin as production, which matters more than it looks: when the intel
# Worker is deployed it refuses browser requests from origins outside
# ALLOWED_ORIGINS, and a preview served from this host is already inside it.
# A preview on a different domain would need its own entry, and every new PR
# would need another.
#
# Published and torn down by .github/scripts/deploy-pages.sh, which is covered
# by .github/scripts/test-deploy-pages.sh — worth running if you change it,
# since the rule it enforces (production must not wipe the previews, previews
# must not wipe production) is the one that breaks quietly.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write        # publish to the gh-pages branch
  pull-requests: write   # leave the preview link on the PR

# One group per pull request. Repeated pushes to the same PR queue behind each
# other, which is what you want; two different PRs, and a PR versus the
# production deploy, do not contend at all. See the longer note in static.yml
# for why they must not share: a shared group cost a production deploy on the
# very first merge.
concurrency:
  group: "gh-pages-preview-${{ github.event.pull_request.number }}"
  cancel-in-progress: false

jobs:
  publish:
    # Two reasons this is gated to branches in this repository.
    #
    # The practical one: a pull request opened from a fork gets a read-only
    # token, so the publish step could not push even if it ran. Skipping says
    # so plainly instead of failing every fork PR with a permissions error.
    #
    # The one that matters: this job runs with contents:write against the
    # pull request's own copy of the deploy script. For a branch in this
    # repository that is no escalation — whoever pushed it already has write
    # access. For a fork it would be, which is exactly why forks are excluded
    # rather than handled with pull_request_target.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pull request's code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Publish the preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy-pages.sh preview "${{ github.event.pull_request.number }}"

      - name: Leave the link on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const base = `https://${owner}.github.io/${repo}/pr-preview/pr-${number}`;

            // A marker rather than a fresh comment each time. A PR that gets
            // eight pushes should carry one comment that has been updated
            // eight times, not eight comments.
            const marker = '<!-- pr-preview-link -->';
            const body = [
              marker,
              '### Live preview',
              '',
              `**[Show tracker](${base}/tracker/browse.html)** — the page most changes affect`,
              '',
              `<details><summary>Other entry points</summary>`,
              '',
              `- [Browse / ledger view](${base}/tracker/browse.html)`,
              `- [Map view](${base}/tracker/map.html)`,
              `- [Site root](${base}/)`,
              '</details>',
              '',
              `Built from \`${sha.slice(0, 7)}\`. Updates on every push, and is`,
              'deleted when this pull request closes.',
              '',
              '_Production is untouched until this merges._'
            ].join('\n');

            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number: number });
            const mine = existing.find(c => c.body && c.body.includes(marker));

            if (mine) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number: number, body });
            }

  # A separate job so it can check out the default branch rather than the pull
  # request's head, which may already have been deleted by the time a close
  # event arrives. Removing a preview does not need the source tree anyway.
  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove the preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy-pages.sh remove "${{ github.event.pull_request.number }}"
