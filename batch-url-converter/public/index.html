<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Batch URL Converter</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --accent: #2f5d50;
    --accent-ink: #ffffff;
    --border: #dedad3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.sub {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 28px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }
  label.field-label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    min-height: 220px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85rem;
    resize: vertical;
  }
  .count {
    text-align: right;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 6px;
  }
  .formats {
    display: flex;
    gap: 20px;
    margin: 16px 0 4px;
  }
  .formats label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button#go {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
  }
  button#go:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--muted);
    white-space: pre-wrap;
  }
  #status.error { color: #b3261e; }
  #status.ok { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Batch URL Converter</h1>
  <p class="sub">Paste 50+ URLs (one per line), pick your output, get a single zip back with every page saved.</p>

  <div class="panel">
    <label class="field-label" for="urls">URLs</label>
    <textarea id="urls" placeholder="https://example.com/page-1&#10;https://example.com/page-2&#10;https://example.com/page-3"></textarea>
    <div class="count" id="count">0 URLs</div>

    <div class="formats">
      <label><input type="checkbox" id="fmtHtml" checked /> Save as HTML</label>
      <label><input type="checkbox" id="fmtPdf" checked /> Save as PDF</label>
    </div>

    <button id="go">Convert &amp; Download Zip</button>
    <div id="status"></div>
  </div>
</div>

<script>
  const urlsEl = document.getElementById('urls');
  const countEl = document.getElementById('count');
  const goBtn = document.getElementById('go');
  const statusEl = document.getElementById('status');

  function parseUrls() {
    return urlsEl.value
      .split('\n')
      .map(s => s.trim())
      .filter(Boolean);
  }

  urlsEl.addEventListener('input', () => {
    countEl.textContent = `${parseUrls().length} URL${parseUrls().length === 1 ? '' : 's'}`;
  });

  goBtn.addEventListener('click', async () => {
    const urls = parseUrls();
    const formats = {
      html: document.getElementById('fmtHtml').checked,
      pdf: document.getElementById('fmtPdf').checked,
    };

    if (urls.length === 0) {
      statusEl.textContent = 'Paste at least one URL first.';
      statusEl.className = 'error';
      return;
    }
    if (!formats.html && !formats.pdf) {
      statusEl.textContent = 'Pick at least one output format.';
      statusEl.className = 'error';
      return;
    }

    goBtn.disabled = true;
    statusEl.className = '';
    statusEl.textContent = `Converting ${urls.length} URL${urls.length === 1 ? '' : 's'}… this can take a while for large batches.`;

    try {
      const resp = await fetch('/api/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ urls, formats }),
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `Request failed (${resp.status})`);
      }

      const blob = await resp.blob();
      const a = document.createElement('a');
      const disposition = resp.headers.get('Content-Disposition') || '';
      const match = disposition.match(/filename="(.+?)"/);
      a.href = URL.createObjectURL(blob);
      a.download = match ? match[1] : 'batch-export.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();

      statusEl.textContent = 'Done. Check your downloads — a manifest.json inside the zip lists any URLs that failed.';
      statusEl.className = 'ok';
    } catch (err) {
      statusEl.textContent = `Error: ${err.message}`;
      statusEl.className = 'error';
    } finally {
      goBtn.disabled = false;
    }
  });
</script>
</body>
</html>
