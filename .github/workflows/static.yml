# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The half of the version stamp only the deploy can know. The build
      # writes tracker/version.json with what it made; this adds the commit
      # that is actually being published and when. Without it "which version
      # is live" is a question nobody on either side can answer without
      # guessing from behaviour, which is how a whole afternoon goes.
      - name: Stamp the deployed commit into version.json
        run: |
          python3 - <<'PY'
          import json, os, datetime
          path = 'tracker/version.json'
          data = json.load(open(path)) if os.path.exists(path) else {}
          data['commit'] = os.environ['GITHUB_SHA'][:7]
          data['commitFull'] = os.environ['GITHUB_SHA']
          data['deployedAt'] = datetime.datetime.now(
              datetime.timezone.utc).replace(microsecond=0).isoformat()
          data['runNumber'] = os.environ.get('GITHUB_RUN_NUMBER')
          data.pop('note', None)
          json.dump(data, open(path, 'w'), indent=1)
          print(json.dumps(data, indent=1))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
