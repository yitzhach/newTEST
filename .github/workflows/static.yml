# Publish the production site.
#
# This used to upload an artifact and deploy it through the Pages API. It now
# publishes to the `gh-pages` branch instead, because a Pages site can only
# have one source and the branch is the only source that can hold more than
# one thing at a time — which is what makes per-pull-request previews possible
# alongside production. See .github/workflows/pr-preview.yml.
#
# Repository setting this depends on:
#   Settings -> Pages -> Source: "Deploy from a branch", branch `gh-pages`, / (root)
name: Deploy site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  # Pushing the site to the gh-pages branch. No pages: write or id-token:
  # write any more — nothing here talks to the Pages deployment API.
  contents: write

# Production gets its OWN group, separate from the previews.
#
# These used to share one, on the reasoning that both push to the same branch
# so they may as well queue. That was wrong, and it cost a deploy: GitHub keeps
# at most one *pending* run per concurrency group, so when merging a pull
# request fired three runs into the group within five seconds — the preview
# build, the preview teardown, and this — the production deploy was superseded
# and cancelled before it ran. cancel-in-progress only protects a run that has
# already started.
#
# Collisions on the branch itself are the deploy script's problem, and it
# handles them: a rejected push means someone landed first, so it re-clones
# from their commit and re-applies. That is the real protection. Queueing was
# only ever an optimisation, and it was a harmful one.
concurrency:
  group: "gh-pages-production"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy-pages.sh site

      - name: Say where it went
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tracker/browse.html" >> "$GITHUB_STEP_SUMMARY"
