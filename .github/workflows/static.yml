# Publish the production site.
#
# This used to upload an artifact and deploy it through the Pages API. It now
# publishes to the `gh-pages` branch instead, because a Pages site can only
# have one source and the branch is the only source that can hold more than
# one thing at a time — which is what makes per-pull-request previews possible
# alongside production. See .github/workflows/pr-preview.yml.
#
# Repository setting this depends on:
#   Settings -> Pages -> Source: "Deploy from a branch", branch `gh-pages`, / (root)
name: Deploy site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  # Pushing the site to the gh-pages branch. No pages: write or id-token:
  # write any more — nothing here talks to the Pages deployment API.
  contents: write

# Shared with pr-preview.yml on purpose. Both workflows push to the same
# branch, and two pushes landing together means one of them is rejected. The
# deploy script can recover from that on its own, but not racing in the first
# place is cheaper than recovering.
concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy-pages.sh site

      - name: Say where it went
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tracker/browse.html" >> "$GITHUB_STEP_SUMMARY"
